plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Firebase sign-in turns on once google-services.json is placed in this folder (see firebase/SETUP.md).
// Without it the app builds and runs fully offline.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.funpixelnest.civilcampro'
    compileSdk 34

    defaultConfig {
        applicationId "com.funpixelnest.civilcampro"
        minSdk 23   // Android 6.0+, needed by Firebase sign-in
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    // Sign-in: Firebase Auth (Google, Microsoft / company accounts, Apple)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}

// The PDF, Word, Excel and PowerPoint libraries are bundled in
// app/src/main/assets/civilcam/lib, so reports work offline.
